### config.properties (Configuration File)
```properties
# Browser settings
browser=chrome
headless=false

# Application URL
baseURL=https://example.com

# Implicit wait time (in seconds)
timeout=10

# Test data file paths
testDataPath=src/resources/testdata/testdata.xlsx
jsonDataPath=src/resources/testdata/users.json

# Logging
logLevel=INFO
logFilePath=logs/automation.log

# Screenshot settings
screenshotPath=reports/screenshots/

# Reports
reportPath=reports/

# Credentials (Avoid storing sensitive data in plain text)
username=testuser
password=Test@123